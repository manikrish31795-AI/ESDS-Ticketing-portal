<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deskline – ITSM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f5f6fa;--ink:#1b1f3b;--mute:#7a8095;--line:#e6e8f0;--teal:#f26a1b;--inc:#e03131;--req:#4263eb;--ok:#2f9e44;--sh:0 2px 10px rgba(27,31,59,.06);font-family:"Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}.logo{width:38px;height:38px;border-radius:11px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}.brand b{display:block;font-size:16px}.brand small{color:var(--mute);font-size:12px}
.mod{font-size:12px;color:var(--mute);font-weight:600;padding:0 10px 4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:600;color:#3b4160;text-align:left}.nav:hover{background:var(--bg)}
.nav.on{background:#fff1e8;color:var(--teal)}.ni{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#f1f3f9}.nav.on .ni{background:var(--teal);color:#fff}
.nav em{margin-left:auto;font-style:normal;font-size:12px;background:#ffe3d1;color:var(--teal);border-radius:99px;padding:1px 8px}
.foot{margin-top:auto;display:grid;gap:8px}.user{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700}.user small{display:block;color:var(--mute);font-size:12px}
.bar{display:flex;gap:10px;align-items:center;padding:14px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.bar input,.bar select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.bar input{width:min(340px,100%)}.sp{flex:1}
.orange{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
main{padding:26px 28px 40px}h1{margin:0;font-size:28px;letter-spacing:-.5px}.sub{color:var(--mute);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:22px 0}
.kpi,.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--sh)}
.ico{width:46px;height:46px;border-radius:13px;color:#fff;display:grid;place-items:center}.num{font-size:34px;font-weight:800;margin:14px 0 2px;letter-spacing:-1px}.lab{color:var(--mute)}
.chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.chips span{font-size:12px;font-weight:600;background:#f1f3f9;border-radius:99px;padding:3px 10px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px}.panel h3{margin:0 0 12px;font-size:16px}
.br{display:grid;grid-template-columns:120px 1fr 28px;gap:10px;align-items:center;margin:10px 0}.tr{height:8px;background:#f1f3f9;border-radius:4px}.tr i{display:block;height:100%;border-radius:4px}.br b{text-align:right}
.vh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600}.seg button.on{background:var(--ink);color:#fff}
.list{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.t{display:grid;grid-template-columns:6px 1fr auto;gap:14px;padding:13px 16px 13px 0;border:0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;width:100%;background:none;text-align:left}
.t:last-child{border-bottom:0}.t:hover{background:#fafbfd}.t .k{align-self:stretch}.t.INC .k{background:var(--inc)}.t.REQ .k{background:var(--req)}
.t h3{margin:0 0 3px;font-size:15px}.meta{color:var(--mute);font-size:12.5px;line-height:1.5}
.right{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#e9edf0}
.pill.open{background:#fff0e0;color:#9c4a00}.pill.in_progress{background:#e0edff;color:#14529c}.pill.resolved,.pill.closed{background:#e1f4e5;color:var(--ok)}
.sla{font-size:12px;font-weight:700}.sla.late{color:var(--inc)}.empty{padding:48px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(27,31,59,.5)}
.dlg{padding:24px;display:grid;gap:14px}.dlg h2{margin:0;font-size:20px}label{display:grid;gap:5px;font-weight:600;font-size:13px}
.dlg input,.dlg select,.dlg textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.two,.type{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type label{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:block}.type input{position:absolute;opacity:0}
.type label:has(input:checked){border-color:var(--teal);background:#fff6ef}.type span{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:3px}
.acts{display:flex;justify-content:flex-end;gap:10px}.err{color:var(--inc);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0}dt{color:var(--mute)}dd{margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
.banner{background:#fff4d6;border:1px solid #f0d37a;padding:8px 12px;border-radius:10px;margin:14px 28px 0;font-size:13px}
.tl{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0;margin:0}.tl li{border-top:3px solid var(--line);padding-top:6px;font-size:12px}.tl li.done{border-color:var(--ok)}.tl b{display:block}.tl span{color:var(--mute)}
.cm{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}.cm span{color:var(--mute);font-size:12px}.stars{display:flex;gap:6px}.star{font-size:30px;background:none;border:0;cursor:pointer;color:#ccd;padding:0}.star.on{color:#f59f00}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.bar,main{padding:14px}.two{grid-template-columns:1fr}.banner{margin:10px 14px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo">D</div><div><b>Deskline</b><small>IT service portal</small></div></div>
  <div class="mod">Modules</div>
  <nav id="nav"></nav>
  <div class="foot"><button class="nav" id="out"><span class="ni">&#8617;</span>Sign out</button><div class="user" id="me"></div></div>
</aside>
<section>
  <header class="bar">
    <input id="q" type="search" placeholder="Search tickets, users, assets, seats" aria-label="Search tickets">
    <select id="siteSel" aria-label="Location"></select>
    <span class="sp"></span>
    <select id="exp" aria-label="Export data"><option value="">Export data</option><option value="csv">CSV of this tab (Excel)</option><option value="csvall">CSV of incidents and requests</option><option value="json">JSON of this tab</option></select>
    <button class="orange" id="newBtn">+ New ticket</button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</section>
</div>

<dialog id="newDlg"><form class="dlg" id="newForm" method="dialog">
  <h2>New ticket</h2>
  <div class="type">
    <label><input type="radio" name="type" value="INC" checked><b>Incident</b><span>Something is broken or down</span></label>
    <label><input type="radio" name="type" value="REQ"><b>Service request</b><span>You need something new or changed</span></label>
  </div>
  <label>Title<input name="title" required maxlength="120" placeholder="Short summary"></label>
  <label>Details<textarea name="description" rows="3" placeholder="What happened or what do you need?"></textarea></label>
  <div class="two">
    <label>Location<select name="location" required></select></label>
    <label>Floor or room<input name="spot" placeholder="e.g. 3rd floor"></label>
  </div>
  <div class="two">
    <label>Seat number<input name="seat_no" placeholder="e.g. A-14"></label>
    <label>Asset ID<input name="asset_id" placeholder="e.g. LAP-0142"></label>
  </div>
  <div class="two">
    <label>Category<select name="category"></select></label>
    <label>Priority<select name="priority"></select></label>
  </div>
  <div class="two">
    <label>User name<input name="requester" required></label>
    <label>Mobile number<input name="mobile" type="tel" required inputmode="tel" placeholder="e.g. 98765 43210"></label>
  </div>
  <div class="two">
    <label>Email<input name="contact" type="email"></label>
    <label>Auto-assigned engineer<input id="autoEng" disabled></label>
  </div>
  <div class="err" id="newErr"></div>
  <div class="acts"><button type="button" class="btn" id="cancelNew">Cancel</button><button class="btn p" id="saveNew" type="submit">Create ticket</button></div>
</form></dialog>

<dialog id="viewDlg"><div class="dlg" id="viewBody"></div></dialog>

<dialog id="authDlg"><form class="dlg" id="authForm" method="dialog">
  <h2>Sign in to Deskline</h2>
  <label>Email<input name="email" type="email" required autocomplete="username"></label>
  <label>Password<input name="password" type="password" minlength="6" required autocomplete="current-password"></label>
  <div class="err" id="authErr"></div>
  <div class="acts"><button type="button" class="btn" id="signUp">Create account</button><button class="btn p" type="submit">Sign in</button></div>
</form></dialog>

<datalist id="engs"></datalist>
<div id="toast" role="status"></div>

<script>
// 1. Paste your Supabase values here (Project settings > API). Use the anon key only.
const CFG = { url: "https://gnopxmohvfzlnefakzar.supabase.co", key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdub3B4bW9odmZ6bG5lZmFremFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3Njk4NTQsImV4cCI6MjA5ODM0NTg1NH0.jOom3T1A_DZUB-lx0pzYsilDg5gJaRlfRLoYgWzjML4" };

const SITES = ["Mumbai HQ", "Nashik data centre", "Chennai office", "Remote or home"];
const ENGINEERS = ["Engineer A", "Engineer B", "Engineer C"]; // edit to your engineers
const CATS = {
  INC: ["Network", "Hardware", "Software", "Email", "Security", "Other"],
  REQ: ["New access", "New hardware", "Software install", "Move or change", "Other"]
};
const SLA = { P1: [15, 240], P2: [30, 360], P3: [60, 720], P4: [0, 720], P5: [0, 1440] }; // [response min, resolution min]; 1 business day = 12 hrs
const SLA_TXT = { P1: "respond 15 min, fix 4 hrs", P2: "respond 30 min, fix 6 hrs", P3: "respond 1 hr, fix 1 business day", P4: "fix 1 business day", P5: "fix 2 business days" };
const PRI = { P1: "P1 Critical", P2: "P2 High", P3: "P3 Medium", P4: "P4 Standard", P5: "P5 Low" };
const STAT = { open: "Open", in_progress: "In progress", resolved: "Resolved", closed: "Closed" };

const TBL = "deskline_tickets";
const demo = !CFG.url;
let V = "dash", UN = "", ROLE = "user", MYLOC = "", STAFF = [], RATE = 0;
let db = null, T = [], F = { type: "INC", status: "open", site: "all", q: "" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const code = t => (t.type === "INC" ? "INC-" : "REQ-") + String(t.number).padStart(4, "0");
const isOpen = t => t.status === "open" || t.status === "in_progress";
const dueRes = t => new Date(t.created_at).getTime() + SLA[t.priority][1] * 6e4;
const dueResp = t => SLA[t.priority][0] ? new Date(t.created_at).getTime() + SLA[t.priority][0] * 6e4 : 0;
const due = dueRes;
const fmtMin = m => m >= 1440 ? m / 720 + " business days" : m === 720 ? "1 business day" : m >= 60 ? m / 60 + (m === 60 ? " hr" : " hrs") : m + " min";

function toast(m) { const e = $("#toast"); e.textContent = m; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 2200); }

function dur(ms) { const h = Math.abs(ms) / 36e5; return h >= 24 ? Math.round(h / 24) + "d" : h >= 1 ? Math.round(h) + "h" : Math.round(h * 60) + "m"; }
function slaText(t) {
  if (t.status === "resolved" || t.status === "closed") { const late = new Date(t.resolved_at || t.closed_at || Date.now()).getTime() > dueRes(t); return { s: late ? "SLA breached" : "SLA met", late }; }
  const ms = dueRes(t) - Date.now();
  return ms < 0 ? { s: "Fix overdue " + dur(ms), late: true } : { s: dur(ms) + " to fix", late: false };
}
function slaLine(t) {
  const r = dueResp(t);
  if (r && t.status === "open" && !t.acknowledged_at) { const ms = r - Date.now(); return ms < 0 ? { s: "Response overdue " + dur(ms), late: true } : { s: "Respond in " + dur(ms), late: false }; }
  return slaText(t);
}

function seed() {
  const now = Date.now(), H = 36e5;
  return [
    ["INC", "Core switch dropping packets", "Nashik data centre", "Rack B4", "P1", "open", "Network", 3],
    ["INC", "Outlook keeps asking for password", "Mumbai HQ", "2nd floor, desk 21", "P3", "in_progress", "Email", 20],
    ["REQ", "VPN access for new joiner", "Chennai office", "Admin desk", "P5", "open", "New access", 6],
    ["REQ", "Second monitor for finance team", "Mumbai HQ", "4th floor", "P4", "open", "New hardware", 30],
    ["INC", "Printer offline on 3rd floor", "Mumbai HQ", "3rd floor print room", "P2", "closed", "Hardware", 50]
  ].map((r, i) => ({ id: "d" + i, number: i + 1, type: r[0], title: r[1], description: "", location: r[2], spot: r[3], priority: r[4], status: r[5], category: r[6], requester: "Demo user", mobile: "98765 43210", seat_no: "A-" + (10 + i), asset_id: "LAP-01" + (40 + i), contact: "", assignee: i % 2 ? "Engineer A" : "", acknowledged_at: r[5] === "open" ? null : new Date(now - 40 * H).toISOString(), resolved_at: r[5] === "closed" ? new Date(now - 3 * H).toISOString() : null, closed_at: r[5] === "closed" ? new Date(now - 2 * H).toISOString() : null, csat: null, csat_comment: "", comments: r[5] === "closed" ? [{ by: "Engineer A", text: "Replaced the toner and tested printing.", at: new Date(now - 3 * H).toISOString() }] : [], created_at: new Date(now - r[7] * H).toISOString() }));
}

async function load() {
  if (demo) { T = seed(); return; }
  const { data, error } = await db.from(TBL).select("*").order("created_at", { ascending: false });
  if (error) { toast("Could not load tickets: " + error.message); return; }
  T = data;
}

function filtered(ignoreSite, anyType) {
  const q = F.q.toLowerCase();
  return T.filter(t =>
    (anyType || t.type === F.type) &&
    (F.status === "all" || (F.status === "open" ? isOpen(t) : !isOpen(t))) &&
    (ignoreSite || F.site === "all" || t.location === F.site) &&
    (!q || [t.title, t.spot, t.seat_no, t.asset_id, t.mobile, t.assignee, t.requester, t.category, code(t)].join(" ").toLowerCase().includes(q)));
}

const IC = { dash: "M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z", INC: "M13 2L3 14h9l-1 8 10-12h-9z", REQ: "M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z", SLA: "M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z", up: "M3 17l6-6 4 4 8-8", usr: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6" };
IC.mine = IC.REQ;
const ic = k => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="${IC[k]}"/></svg>`;
function showUser() { $("#me").innerHTML = `<div class="av">${esc(UN.charAt(0).toUpperCase())}</div><div><b>${esc(UN)}</b><small>${ROLE === "admin" ? "Engineer" + (MYLOC ? ", " + esc(MYLOC) : "") : "User"}</small></div>`; }

function rowHtml(t) {
  const s = slaLine(t);
  return `<button class="t ${t.type}" data-id="${esc(t.id)}"><span class="k"></span><div><h3>${esc(t.title)}</h3><div class="meta">${code(t)}, ${esc(t.category || "General")}, ${esc(t.location)}${t.seat_no ? ", seat " + esc(t.seat_no) : ""}${t.asset_id ? ", asset " + esc(t.asset_id) : ""}</div><div class="meta">${esc(t.requester)}${t.mobile ? ", " + esc(t.mobile) : ""}, engineer: ${esc(t.assignee) || "unassigned"}</div></div><div class="right"><span class="pill ${t.status}">${STAT[t.status]}</span><span class="sla ${s.late ? "late" : ""}">${PRI[t.priority]}, ${s.s}</span></div></button>`;
}
const listHtml = a => a.length ? a.map(rowHtml).join("") : `<div class="empty">No tickets here yet. Choose New ticket to log one, or clear the search and filters.</div>`;
const bars = r => r.map(x => `<div class="br"><span>${esc(x[0])}</span><div class="tr"><i style="width:${x[1] / Math.max(1, ...r.map(y => y[1])) * 100}%;background:${x[2]}"></i></div><b>${x[1]}</b></div>`).join("") || `<div class="meta">Nothing open right now.</div>`;
const kpi = (color, icon, label, a) => `<div class="kpi"><div class="ico" style="background:${color}">${ic(icon)}</div><div class="num">${a.length}</div><div class="lab">${label}</div><div class="chips"><span>Incidents ${a.filter(t => t.type === "INC").length}</span><span>Requests ${a.filter(t => t.type === "REQ").length}</span></div></div>`;

function mineHtml() {
  const q = F.q.toLowerCase(), rows = T.filter(t => !q || [t.title, code(t)].join(" ").toLowerCase().includes(q)), pend = rows.filter(t => t.status === "closed" && !t.csat);
  return `<div class="vh"><div><h1>My tickets</h1><div class="sub">Raise a ticket and follow it here. It goes straight to the engineer for the location you choose.</div></div></div>` +
    (pend.length ? `<div class="banner" style="margin:0 0 16px">${pend.map(t => `<div>${code(t)} is closed. <button class="btn" data-open="1" data-id="${esc(t.id)}">Rate your experience</button></div>`).join("")}</div>` : "") +
    `<div class="list">${listHtml(rows)}</div>`;
}

function render() {
  const scope = T.filter(t => F.site === "all" || t.location === F.site), op = scope.filter(isOpen), late = op.filter(t => slaText(t).late);
  $("#nav").innerHTML = (ROLE === "user" ? [["mine", "My tickets"]] : [["dash", "Dashboard"], ["INC", "Incidents"], ["REQ", "Service requests"], ["SLA", "SLA reports"]]).map(([k, l]) =>
    `<button class="nav ${V === k ? "on" : ""}" data-nav="${k}"><span class="ni">${ic(k)}</span>${l}${k === "INC" || k === "REQ" ? `<em>${op.filter(t => t.type === k).length}</em>` : k === "SLA" && late.length ? `<em>${late.length}</em>` : ""}</button>`).join("");
  if (ROLE === "user") V = "mine";
  let h;
  if (V === "mine") { h = mineHtml(); } else if (V === "dash") {
    const hr = new Date().getHours(), eng = {}, rated = scope.filter(t => t.csat), avg = rated.length ? (rated.reduce((a, t) => a + t.csat, 0) / rated.length).toFixed(1) : null;
    op.forEach(t => { const k = t.assignee || "Unassigned"; eng[k] = (eng[k] || 0) + 1; });
    h = `<h1>${hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening"}, ${esc(UN || "there")}</h1><div class="sub">Your IT overview for ${F.site === "all" ? "all locations" : esc(F.site)}. Customer satisfaction: ${avg ? avg + " of 5 from " + rated.length + " ratings" : "no ratings yet"}.</div>
    <div class="grid">${kpi("#4c6ef5", "dash", "Total tickets", scope)}${kpi("#f76707", "INC", "Open", scope.filter(t => t.status === "open"))}${kpi("#7048e8", "up", "In progress", scope.filter(t => t.status === "in_progress"))}${kpi("#2f9e44", "REQ", "Resolved or closed", scope.filter(t => !isOpen(t)))}${kpi("#e03131", "SLA", "Overdue", late)}${kpi("#0c8599", "usr", "Not assigned", op.filter(t => !t.assignee))}</div>
    <div class="panels"><div class="panel"><h3>Open by priority</h3>${bars(["P1", "P2", "P3", "P4", "P5"].map(p => [PRI[p], op.filter(t => t.priority === p).length, { P1: "#e03131", P2: "#f76707", P3: "#f59f00", P4: "#4c6ef5", P5: "#2f9e44" }[p]]))}</div>
    <div class="panel"><h3>Open by location</h3>${bars(SITES.map(x => [x, op.filter(t => t.location === x).length, "#f26a1b"]))}</div>
    <div class="panel"><h3>Engineer workload</h3>${bars(Object.entries(eng).map(([k, n]) => [k, n, "#4c6ef5"]))}</div></div>
    <div class="panel"><h3>Latest open tickets</h3><div class="list" style="box-shadow:none;border:1px solid var(--line)">${listHtml(op.slice(0, 5))}</div></div>`;
  } else if (V === "SLA") {
    const rows = filtered(false, true).filter(isOpen).sort((a, b) => due(a) - due(b));
    h = `<div class="vh"><div><h1>SLA reports</h1><div class="sub">${late.length} overdue out of ${op.length} open tickets. Closest to breach first.</div></div></div><div class="list">${listHtml(rows)}</div>`;
  } else {
    const rows = filtered();
    h = `<div class="vh"><div><h1>${V === "INC" ? "Incidents" : "Service requests"}</h1><div class="sub">${rows.length} shown</div></div><div class="seg">${[["open", "Active"], ["resolved", "Resolved or closed"], ["all", "All"]].map(([k, l]) => `<button data-st="${k}" class="${F.status === k ? "on" : ""}">${l}</button>`).join("")}</div></div><div class="list">${listHtml(rows)}</div>`;
  }
  $("#view").innerHTML = h;
}

function setTab(v) { F.type = v; V = v; }
const engFor = loc => (STAFF.find(s => s.location === loc) || {}).name || "";
function updateAuto() { $("#autoEng").value = engFor($("#newForm").location.value) || "Assigned by admin"; }

function fillNewForm() {
  const f = $("#newForm"), type = f.type.value;
  f.category.innerHTML = CATS[type].map(c => `<option>${c}</option>`).join("");
  f.location.innerHTML = SITES.map(s => `<option>${esc(s)}</option>`).join("");
  if (F.site !== "all") f.location.value = F.site;
  f.priority.innerHTML = (type === "INC" ? ["P1", "P2", "P3"] : ["P4", "P5"]).map(p => `<option value="${p}">${PRI[p]} (${SLA_TXT[p]})</option>`).join("");
  updateAuto();
}

function openView(id) {
  const t = T.find(x => String(x.id) === id); if (!t) return;
  RATE = 0;
  const adm = ROLE === "admin", step = (l, at) => `<li class="${at ? "done" : ""}"><b>${l}</b><span>${at ? new Date(at).toLocaleString() : "Pending"}</span></li>`;
  const cm = (t.comments || []).map(c => `<div class="cm"><b>${esc(c.by)}</b> <span>${new Date(c.at).toLocaleString()}</span><div>${esc(c.text)}</div></div>`).join("") || `<div class="meta">No updates yet.</div>`;
  const bt = (k, l, p) => `<button class="btn ${p ? "p" : ""}" data-act="${k}" data-id="${esc(t.id)}">${l}</button>`;
  const rating = t.csat ? `<div class="meta">You rated this ${t.csat} of 5.</div>` : t.status === "closed" ? `<div><b>How did we do?</b><div class="stars">${[1, 2, 3, 4, 5].map(n => `<button class="star" data-rate="${n}" aria-label="${n} stars">&#9733;</button>`).join("")}</div></div><label>Comment (optional)<textarea id="cc" rows="2"></textarea></label><div class="acts"><button class="btn p" data-send="${esc(t.id)}">Send rating</button></div>` : "";
  $("#viewBody").innerHTML = `<h2>${esc(t.title)}</h2><div class="meta">${code(t)}, ${t.type === "INC" ? "Incident" : "Service request"}, ${PRI[t.priority]}</div>
  <ol class="tl">${step("Raised", t.created_at)}${step("Acknowledged", t.acknowledged_at)}${step("Resolved", t.resolved_at)}${step("Closed", t.closed_at)}</ol>
  <dl><dt>SLA</dt><dd>${SLA[t.priority][0] ? "Respond within " + fmtMin(SLA[t.priority][0]) + ", " : ""}fix within ${fmtMin(SLA[t.priority][1])}. Now: ${slaLine(t).s}</dd>
  <dt>Location</dt><dd>${esc(t.location)}${t.spot ? ", " + esc(t.spot) : ""}</dd><dt>Seat, asset</dt><dd>${esc(t.seat_no) || "Not given"}, ${esc(t.asset_id) || "not given"}</dd>
  <dt>User</dt><dd>${esc(t.requester)}, ${esc(t.mobile) || "no mobile"}${t.contact ? ", " + esc(t.contact) : ""}</dd>
  <dt>Engineer</dt><dd>${adm ? `<input id="asg" list="engs" value="${esc(t.assignee)}" placeholder="Assign an engineer">` : esc(t.assignee) || "Being assigned"}</dd>
  <dt>Details</dt><dd>${esc(t.description) || "None provided"}</dd></dl>
  <div><b>Updates</b>${cm}</div>
  ${adm ? `<label>Update or resolution note<textarea id="cmt" rows="3" placeholder="What was checked or fixed?"></textarea></label>
  <div class="acts"><button class="btn" id="closeView">Cancel</button>${bt("note", "Save update")}${t.status === "open" ? bt("ack", "Acknowledge", 1) : ""}${t.status === "open" || t.status === "in_progress" ? bt("res", "Resolve", 1) : ""}${t.status === "resolved" ? bt("close", "Close ticket", 1) : ""}</div>`
  : `${rating}<div class="acts"><button class="btn" id="closeView">Close window</button></div>`}`;
  $("#viewDlg").showModal();
}

async function patchTicket(id, patch) {
  if (!demo) { const { error } = await db.from(TBL).update(patch).eq("id", id); if (error) { toast("Save failed: " + error.message); return false; } }
  Object.assign(T.find(x => String(x.id) === id), patch); return true;
}

async function act(id, kind) {
  const t = T.find(x => String(x.id) === id), txt = $("#cmt").value.trim(), now = new Date().toISOString(), patch = {};
  if (kind === "ack") { patch.status = "in_progress"; patch.acknowledged_at = now; }
  if (kind === "res") { if (!txt) return toast("Add a note describing the fix before resolving"); patch.status = "resolved"; patch.resolved_at = now; if (!t.acknowledged_at) patch.acknowledged_at = now; }
  if (kind === "close") { patch.status = "closed"; patch.closed_at = now; }
  const asg = $("#asg").value.trim(); if (asg !== (t.assignee || "")) patch.assignee = asg;
  if (txt) patch.comments = [...(t.comments || []), { by: UN, text: txt, at: now }];
  if (!Object.keys(patch).length) return toast("Nothing to save yet");
  if (!await patchTicket(id, patch)) return;
  $("#viewDlg").close(); render();
  toast(kind === "close" ? "Ticket closed. The user can now rate the service" : "Saved");
}

async function sendRating(id) {
  if (!RATE) return toast("Choose a star rating first");
  if (!await patchTicket(id, { csat: RATE, csat_comment: ($("#cc").value || "").trim() })) return;
  RATE = 0; $("#viewDlg").close(); render(); toast("Thanks for your feedback");
}

function swapRole(b) {
  ROLE = ROLE === "user" ? "admin" : "user"; UN = ROLE === "admin" ? ENGINEERS[0] : "Demo user";
  V = ROLE === "user" ? "mine" : "dash"; $("#exp").hidden = ROLE === "user";
  b.lastChild.textContent = ROLE === "user" ? "Preview as engineer" : "Preview as user"; showUser(); render();
}

async function createTicket(e) {
  e.preventDefault();
  const f = $("#newForm"), d = Object.fromEntries(new FormData(f));
  const rec = { type: d.type, title: d.title.trim(), description: d.description.trim(), location: d.location, spot: d.spot.trim(), seat_no: d.seat_no.trim(), asset_id: d.asset_id.trim(), category: d.category, priority: d.priority, requester: d.requester.trim(), mobile: d.mobile.trim(), contact: d.contact.trim(), assignee: engFor(d.location), status: "open" };
  $("#saveNew").disabled = true; $("#newErr").textContent = "";
  if (demo) { T.unshift({ ...rec, id: "d" + Date.now(), number: T.length + 1, created_at: new Date().toISOString() }); }
  else {
    const { data, error } = await db.from(TBL).insert(rec).select().single();
    if (error) { $("#newErr").textContent = "Could not create ticket: " + error.message; $("#saveNew").disabled = false; return; }
    T.unshift(data);
  }
  $("#saveNew").disabled = false; $("#newDlg").close(); f.reset(); setTab(rec.type); render(); toast("Ticket created");
}

function exportData(kind) {
  const rows = filtered(false, kind === "csvall");
  if (!rows.length) return toast("Nothing to export with these filters");
  const stamp = new Date().toISOString().slice(0, 10);
  if (kind === "json") return save(`tickets-${stamp}.json`, "application/json", JSON.stringify(rows, null, 2));
  const cols = ["number", "type", "title", "status", "priority", "category", "location", "spot", "seat_no", "asset_id", "requester", "mobile", "contact", "assignee", "description", "acknowledged_at", "resolved_at", "closed_at", "csat", "created_at"];
  const cell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = [cols.join(","), ...rows.map(r => cols.map(c => cell(c === "number" ? code(r) : r[c])).join(","))].join("\r\n");
  save(`tickets-${stamp}.csv`, "text/csv;charset=utf-8", "\ufeff" + csv);
}
function save(name, mime, text) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; a.click(); URL.revokeObjectURL(a.href);
  toast("Exported " + name);
}

async function boot() {
  $("#siteSel").innerHTML = '<option value="all">All locations</option>' + SITES.map(x => `<option>${esc(x)}</option>`).join("");
  $("#engs").innerHTML = ENGINEERS.map(e => `<option value="${esc(e)}">`).join("");
  if (demo) {
    $("#banner").innerHTML = `<div class="banner">Demo mode: data resets on refresh. Add your Supabase URL and anon key at the top of the script to save tickets permanently.</div>`;
    UN = "Demo user"; STAFF = SITES.map((x, i) => ({ name: ENGINEERS[i % ENGINEERS.length], location: x }));
    $("#me").insertAdjacentHTML("beforebegin", '<button class="nav" id="swap"><span class="ni">&#8644;</span>Preview as engineer</button>'); showUser();
  } else {
    db = supabase.createClient(CFG.url, CFG.key);
    const { data: { session } } = await db.auth.getSession();
    if (!session) { $("#authDlg").showModal(); return; }
    UN = session.user.email.split("@")[0];
    const { data: st } = await db.from("deskline_staff").select("*"); STAFF = st || [];
    const me = STAFF.find(x => x.email.toLowerCase() === session.user.email.toLowerCase());
    if (me) { ROLE = "admin"; MYLOC = me.location; UN = me.name; }
    showUser();
  }
  $("#exp").hidden = ROLE === "user"; V = ROLE === "user" ? "mine" : "dash"; await load(); render();
}

document.addEventListener("click", e => {
  const c = e.target.closest("button"); if (!c) return;
  if (c.dataset.nav) { V = c.dataset.nav; if (V === "INC" || V === "REQ") F.type = V; render(); }
  else if (c.dataset.st) { F.status = c.dataset.st; render(); }
  else if (c.dataset.open) openView(c.dataset.id);
  else if (c.dataset.act) act(c.dataset.id, c.dataset.act);
  else if (c.dataset.rate) { RATE = +c.dataset.rate; document.querySelectorAll(".star").forEach(b => b.classList.toggle("on", +b.dataset.rate <= RATE)); }
  else if (c.dataset.send) sendRating(c.dataset.send);
  else if (c.id === "swap") swapRole(c);
  else if (c.classList.contains("t")) openView(c.dataset.id);
  else if (c.id === "newBtn") { $("#newForm").type.value = F.type; fillNewForm(); $("#newDlg").showModal(); }
  else if (c.id === "cancelNew") $("#newDlg").close();
  else if (c.id === "closeView") $("#viewDlg").close();
  else if (c.id === "out") (db ? db.auth.signOut() : Promise.resolve()).then(() => location.reload());
  else if (c.id === "signUp") authDo("signUp");
});
$("#newForm").addEventListener("change", e => { if (e.target.name === "type") fillNewForm(); if (e.target.name === "location") updateAuto(); });
$("#newForm").addEventListener("submit", createTicket);
$("#siteSel").onchange = e => { F.site = e.target.value; render(); };
$("#q").oninput = e => { F.q = e.target.value; render(); };
$("#exp").onchange = e => { if (e.target.value) exportData(e.target.value); e.target.value = ""; };
$("#authForm").addEventListener("submit", e => { e.preventDefault(); authDo("signInWithPassword"); });
async function authDo(fn) {
  const d = Object.fromEntries(new FormData($("#authForm")));
  const { error } = await db.auth[fn]({ email: d.email, password: d.password });
  if (error) { $("#authErr").textContent = error.message; return; }
  if (fn === "signUp") { $("#authErr").textContent = "Account created. Check your email to confirm it if required, then sign in."; return; }
  $("#authDlg").close(); boot();
}
setInterval(() => { if (T.length) render(); }, 60000);
boot();
</script>
</body>
</html>
