<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deskline – ITSM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#eceff2;--panel:#fff;--ink:#17202a;--mute:#66727f;--line:#d9dee3;--teal:#0e5a5f;--inc:#d9480f;--req:#1c6dd0;--ok:#2b8a3e;font-family:"Schibsted Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--teal);color:#e6f2f2;padding:22px 18px;display:flex;flex-direction:column;gap:18px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.brand small{display:block;font-weight:400;font-size:12px;opacity:.7;letter-spacing:0}
.site{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer}
.site:hover,.site.on{background:rgba(255,255,255,.14)}
.site .row{display:flex;justify-content:space-between;font-weight:500}
.bar{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:6px}.bar i{display:block;height:100%;background:#ffd8a8;border-radius:2px}
.me{margin-top:auto;font-size:12px;opacity:.8}.me button{background:none;border:0;color:#ffd8a8;cursor:pointer;padding:0;text-decoration:underline}
main{padding:24px 28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:28px;letter-spacing:-.8px}
.kpis{display:flex;gap:28px;margin:6px 0 0;color:var(--mute)}.kpis b{font-size:22px;color:var(--ink);margin-right:4px}.kpis .bad b{color:var(--inc)}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn:hover{border-color:var(--ink)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 12px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.tools input,.tools select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.tools input{flex:1;min-width:160px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.t{display:grid;grid-template-columns:6px 1fr auto;gap:14px;padding:13px 16px 13px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.t:last-child{border-bottom:0}.t:hover{background:#f6f8f9}
.t .k{align-self:stretch}.t.INC .k{background:var(--inc)}.t.REQ .k{background:var(--req)}
.t h3{margin:0 0 3px;font-size:15px;font-weight:700}.meta{color:var(--mute);font-size:12.5px}
.right{text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:#e9edf0}
.pill.open{background:#fff0e0;color:#9c4a00}.pill.in_progress{background:#e0edff;color:#14529c}.pill.resolved,.pill.closed{background:#e1f4e5;color:var(--ok)}
.sla{font-size:12px;font-weight:700}.sla.late{color:var(--inc)}
.empty{padding:48px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(23,32,42,.5)}
.dlg{padding:24px;display:grid;gap:14px}.dlg h2{margin:0;font-size:20px}
label{display:grid;gap:5px;font-weight:500;font-size:13px}
.dlg input,.dlg select,.dlg textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type label{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:block}
.type input{position:absolute;opacity:0}.type label:has(input:checked){border-color:var(--teal);background:#eef7f7}
.type span{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:3px}
.acts{display:flex;justify-content:flex-end;gap:10px}.err{color:var(--inc);font-size:13px}
dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0}dt{color:var(--mute)}dd{margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
.banner{background:#fff4d6;border:1px solid #f0d37a;padding:8px 12px;border-radius:8px;margin-top:14px;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);width:100%}.tabs button{border:0;background:none;padding:10px 18px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-size:15px}.tabs button.on[data-v=INC]{border-color:var(--inc)}.tabs button.on[data-v=REQ]{border-color:var(--req)}.tabs span{font-weight:500;color:var(--mute);margin-left:4px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{padding:14px}.sites{display:flex;gap:6px;overflow-x:auto}.site{min-width:130px}.me{display:none}main{padding:16px}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">Deskline<small>IT incidents and requests</small></div>
  <div class="sites" id="sites" role="list"></div>
  <div class="me" id="me"></div>
</aside>
<main>
  <div class="top">
    <div><h1 id="heading">All locations</h1><div class="kpis" id="kpis"></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <select class="btn" id="exp" aria-label="Export data"><option value="">Export data</option><option value="csv">Download CSV (Excel)</option><option value="csvall">Download CSV, incidents and requests</option><option value="json">Download JSON</option></select>
      <button class="btn p" id="newBtn">New ticket</button>
    </div>
  </div>
  <div id="banner"></div>
  <div class="tools">
    <div class="tabs" id="typeSeg" role="tablist"><button data-v="INC" class="on" role="tab">Incidents<span id="cInc"></span></button><button data-v="REQ" role="tab">Service requests<span id="cReq"></span></button></div>
    <select id="statusSel" aria-label="Status"><option value="open">Active</option><option value="all">Any status</option><option value="resolved">Resolved or closed</option></select>
    <input id="q" type="search" placeholder="Search title, desk, requester" aria-label="Search tickets">
  </div>
  <div class="list" id="list"></div>
</main>
</div>

<dialog id="newDlg"><form class="dlg" id="newForm" method="dialog">
  <h2>New ticket</h2>
  <div class="type">
    <label><input type="radio" name="type" value="INC" checked><b>Incident</b><span>Something is broken or down</span></label>
    <label><input type="radio" name="type" value="REQ"><b>Service request</b><span>You need something new or changed</span></label>
  </div>
  <label>Title<input name="title" required maxlength="120" placeholder="Short summary"></label>
  <label>Details<textarea name="description" rows="3" placeholder="What happened or what do you need?"></textarea></label>
  <div class="two">
    <label>Location<select name="location" required></select></label>
    <label>Floor or room<input name="spot" placeholder="e.g. 3rd floor"></label>
  </div>
  <div class="two">
    <label>Seat number<input name="seat_no" placeholder="e.g. A-14"></label>
    <label>Asset ID<input name="asset_id" placeholder="e.g. LAP-0142"></label>
  </div>
  <div class="two">
    <label>Category<select name="category"></select></label>
    <label>Priority<select name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select></label>
  </div>
  <div class="two">
    <label>User name<input name="requester" required></label>
    <label>Mobile number<input name="mobile" type="tel" required inputmode="tel" placeholder="e.g. 98765 43210"></label>
  </div>
  <div class="two">
    <label>Email<input name="contact" type="email"></label>
    <label>Assigned engineer<input name="assignee" list="engs" placeholder="Choose or type a name"></label>
  </div>
  <div class="err" id="newErr"></div>
  <div class="acts"><button type="button" class="btn" id="cancelNew">Cancel</button><button class="btn p" id="saveNew" type="submit">Create ticket</button></div>
</form></dialog>

<dialog id="viewDlg"><div class="dlg" id="viewBody"></div></dialog>

<dialog id="authDlg"><form class="dlg" id="authForm" method="dialog">
  <h2>Sign in to Deskline</h2>
  <label>Email<input name="email" type="email" required autocomplete="username"></label>
  <label>Password<input name="password" type="password" minlength="6" required autocomplete="current-password"></label>
  <div class="err" id="authErr"></div>
  <div class="acts"><button type="button" class="btn" id="signUp">Create account</button><button class="btn p" type="submit">Sign in</button></div>
</form></dialog>

<datalist id="engs"></datalist>
<div id="toast" role="status"></div>

<script>
// 1. Paste your Supabase values here (Project settings > API). Use the anon key only.
const CFG = { url: "https://gnopxmohvfzlnefakzar.supabase.co", key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdub3B4bW9odmZ6bG5lZmFremFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3Njk4NTQsImV4cCI6MjA5ODM0NTg1NH0.jOom3T1A_DZUB-lx0pzYsilDg5gJaRlfRLoYgWzjML4" };

const SITES = ["Mumbai HQ", "Nashik data centre", "Chennai office", "Remote or home"];
const ENGINEERS = ["Engineer A", "Engineer B", "Engineer C"]; // edit to your engineers
const CATS = {
  INC: ["Network", "Hardware", "Software", "Email", "Security", "Other"],
  REQ: ["New access", "New hardware", "Software install", "Move or change", "Other"]
};
const SLA_H = { critical: 4, high: 8, medium: 24, low: 72 };
const PRI = { critical: "Critical", high: "High", medium: "Medium", low: "Low" };
const STAT = { open: "Open", in_progress: "In progress", resolved: "Resolved", closed: "Closed" };

const demo = !CFG.url;
let db = null, T = [], F = { type: "INC", status: "open", site: "all", q: "" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const code = t => (t.type === "INC" ? "INC-" : "REQ-") + String(t.number).padStart(4, "0");
const isOpen = t => t.status === "open" || t.status === "in_progress";
const due = t => new Date(t.created_at).getTime() + SLA_H[t.priority] * 36e5;

function toast(m) { const e = $("#toast"); e.textContent = m; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 2200); }

function slaText(t) {
  if (!isOpen(t)) return { s: "Done", late: false };
  const ms = due(t) - Date.now(), h = Math.abs(ms) / 36e5;
  const txt = h >= 24 ? Math.round(h / 24) + "d" : h >= 1 ? Math.round(h) + "h" : Math.round(h * 60) + "m";
  return ms < 0 ? { s: "Overdue " + txt, late: true } : { s: txt + " left", late: false };
}

function seed() {
  const now = Date.now(), H = 36e5;
  return [
    ["INC", "Core switch dropping packets", "Nashik data centre", "Rack B4", "critical", "open", "Network", 3],
    ["INC", "Outlook keeps asking for password", "Mumbai HQ", "2nd floor, desk 21", "medium", "in_progress", "Email", 20],
    ["REQ", "VPN access for new joiner", "Chennai office", "Admin desk", "medium", "open", "New access", 6],
    ["REQ", "Second monitor for finance team", "Mumbai HQ", "4th floor", "low", "open", "New hardware", 30],
    ["INC", "Printer offline on 3rd floor", "Mumbai HQ", "3rd floor print room", "high", "resolved", "Hardware", 50]
  ].map((r, i) => ({ id: "d" + i, number: i + 1, type: r[0], title: r[1], description: "", location: r[2], spot: r[3], priority: r[4], status: r[5], category: r[6], requester: "Demo user", mobile: "98765 43210", seat_no: "A-" + (10 + i), asset_id: "LAP-01" + (40 + i), contact: "", assignee: i % 2 ? "Engineer A" : "", created_at: new Date(now - r[7] * H).toISOString() }));
}

async function load() {
  if (demo) { T = seed(); return; }
  const { data, error } = await db.from("tickets").select("*").order("created_at", { ascending: false });
  if (error) { toast("Could not load tickets: " + error.message); return; }
  T = data;
}

function filtered(ignoreSite, anyType) {
  const q = F.q.toLowerCase();
  return T.filter(t =>
    (anyType || t.type === F.type) &&
    (F.status === "all" || (F.status === "open" ? isOpen(t) : !isOpen(t))) &&
    (ignoreSite || F.site === "all" || t.location === F.site) &&
    (!q || [t.title, t.spot, t.seat_no, t.asset_id, t.mobile, t.assignee, t.requester, t.category, code(t)].join(" ").toLowerCase().includes(q)));
}

function render() {
  const base = T.filter(isOpen), max = Math.max(1, ...SITES.map(s => base.filter(t => t.location === s).length));
  $("#sites").innerHTML = `<button class="site ${F.site === "all" ? "on" : ""}" data-s="all"><div class="row"><span>All locations</span><span>${base.length}</span></div></button>` +
    SITES.map(s => { const n = base.filter(t => t.location === s).length; return `<button class="site ${F.site === s ? "on" : ""}" data-s="${esc(s)}"><div class="row"><span>${esc(s)}</span><span>${n}</span></div><div class="bar"><i style="width:${n / max * 100}%"></i></div></button>`; }).join("");
  $("#heading").textContent = F.site === "all" ? "All locations" : F.site;
  const scope = T.filter(t => F.site === "all" || t.location === F.site), op = scope.filter(isOpen);
  $("#cInc").textContent = op.filter(t => t.type === "INC").length; $("#cReq").textContent = op.filter(t => t.type === "REQ").length;
  $("#kpis").innerHTML = `<span><b>${op.length}</b>open</span><span class="bad"><b>${op.filter(t => slaText(t).late).length}</b>overdue</span><span><b>${op.filter(t => t.type === "INC").length}</b>incidents</span><span><b>${op.filter(t => t.type === "REQ").length}</b>requests</span>`;
  const rows = filtered();
  $("#list").innerHTML = rows.length ? rows.map(t => { const s = slaText(t); return `<button class="t ${t.type}" data-id="${esc(t.id)}"><span class="k"></span><div><h3>${esc(t.title)}</h3><div class="meta">${code(t)}, ${esc(t.category || "General")}, ${esc(t.location)}${t.seat_no ? ", seat " + esc(t.seat_no) : ""}${t.asset_id ? ", asset " + esc(t.asset_id) : ""}</div><div class="meta">${esc(t.requester)}${t.mobile ? ", " + esc(t.mobile) : ""}, engineer: ${esc(t.assignee) || "unassigned"}</div></div><div class="right"><span class="pill ${t.status}">${STAT[t.status]}</span><span class="sla ${s.late ? "late" : ""}">${PRI[t.priority]}, ${s.s}</span></div></button>`; }).join("")
    : `<div class="empty">No tickets match these filters. Clear the search or choose New ticket to log one.</div>`;
}

function setTab(v) { F.type = v; document.querySelectorAll("#typeSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === v)); }

function fillNewForm() {
  const f = $("#newForm"), type = f.type.value;
  f.category.innerHTML = CATS[type].map(c => `<option>${c}</option>`).join("");
  f.location.innerHTML = SITES.map(s => `<option>${esc(s)}</option>`).join("");
  if (F.site !== "all") f.location.value = F.site;
}

function openView(id) {
  const t = T.find(x => String(x.id) === id); if (!t) return;
  const s = slaText(t);
  $("#viewBody").innerHTML = `<h2>${esc(t.title)}</h2><div class="meta">${code(t)}, ${t.type === "INC" ? "Incident" : "Service request"}</div>
  <dl><dt>Status</dt><dd><select id="stSel">${Object.entries(STAT).map(([k, v]) => `<option value="${k}" ${k === t.status ? "selected" : ""}>${v}</option>`).join("")}</select></dd>
  <dt>Priority</dt><dd>${PRI[t.priority]}, ${s.s}</dd><dt>Location</dt><dd>${esc(t.location)}${t.spot ? ", " + esc(t.spot) : ""}</dd><dt>Seat number</dt><dd>${esc(t.seat_no) || "Not given"}</dd><dt>Asset ID</dt><dd>${esc(t.asset_id) || "Not given"}</dd>
  <dt>Category</dt><dd>${esc(t.category)}</dd><dt>User</dt><dd>${esc(t.requester)}</dd><dt>Mobile</dt><dd>${esc(t.mobile) || "Not given"}</dd><dt>Email</dt><dd>${esc(t.contact) || "Not given"}</dd>
  <dt>Engineer</dt><dd><input id="asg" list="engs" value="${esc(t.assignee)}" placeholder="Assign an engineer"></dd>
  <dt>Details</dt><dd>${esc(t.description) || "None provided"}</dd>
  <dt>Logged</dt><dd>${new Date(t.created_at).toLocaleString()}</dd></dl>
  <div class="acts"><button class="btn" id="closeView">Close</button><button class="btn p" id="saveView" data-id="${esc(t.id)}">Save changes</button></div>`;
  $("#viewDlg").showModal();
}

async function saveView(id) {
  const patch = { status: $("#stSel").value, assignee: $("#asg").value.trim() };
  if (!demo) { const { error } = await db.from("tickets").update(patch).eq("id", id); if (error) return toast("Save failed: " + error.message); }
  Object.assign(T.find(x => String(x.id) === id), patch);
  $("#viewDlg").close(); render(); toast("Changes saved");
}

async function createTicket(e) {
  e.preventDefault();
  const f = $("#newForm"), d = Object.fromEntries(new FormData(f));
  const rec = { type: d.type, title: d.title.trim(), description: d.description.trim(), location: d.location, spot: d.spot.trim(), seat_no: d.seat_no.trim(), asset_id: d.asset_id.trim(), category: d.category, priority: d.priority, requester: d.requester.trim(), mobile: d.mobile.trim(), contact: d.contact.trim(), assignee: d.assignee.trim(), status: "open" };
  $("#saveNew").disabled = true; $("#newErr").textContent = "";
  if (demo) { T.unshift({ ...rec, id: "d" + Date.now(), number: T.length + 1, created_at: new Date().toISOString() }); }
  else {
    const { data, error } = await db.from("tickets").insert(rec).select().single();
    if (error) { $("#newErr").textContent = "Could not create ticket: " + error.message; $("#saveNew").disabled = false; return; }
    T.unshift(data);
  }
  $("#saveNew").disabled = false; $("#newDlg").close(); f.reset(); setTab(rec.type); render(); toast("Ticket created");
}

function exportData(kind) {
  const rows = filtered(false, kind === "csvall");
  if (!rows.length) return toast("Nothing to export with these filters");
  const stamp = new Date().toISOString().slice(0, 10);
  if (kind === "json") return save(`tickets-${stamp}.json`, "application/json", JSON.stringify(rows, null, 2));
  const cols = ["number", "type", "title", "status", "priority", "category", "location", "spot", "seat_no", "asset_id", "requester", "mobile", "contact", "assignee", "description", "created_at"];
  const cell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = [cols.join(","), ...rows.map(r => cols.map(c => cell(c === "number" ? code(r) : r[c])).join(","))].join("\r\n");
  save(`tickets-${stamp}.csv`, "text/csv;charset=utf-8", "\ufeff" + csv);
}
function save(name, mime, text) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; a.click(); URL.revokeObjectURL(a.href);
  toast("Exported " + name);
}

async function boot() {
  $("#engs").innerHTML = ENGINEERS.map(e => `<option value="${esc(e)}">`).join("");
  if (demo) {
    $("#banner").innerHTML = `<div class="banner">Demo mode: data resets on refresh. Add your Supabase URL and anon key at the top of the script to save tickets permanently.</div>`;
    $("#me").textContent = "Demo user";
  } else {
    db = supabase.createClient(CFG.url, CFG.key);
    const { data: { session } } = await db.auth.getSession();
    if (!session) { $("#authDlg").showModal(); return; }
    $("#me").innerHTML = esc(session.user.email) + ' <button id="out">Sign out</button>';
  }
  await load(); render();
}

document.addEventListener("click", e => {
  const c = e.target.closest("button"); if (!c) return;
  if (c.dataset.s) { F.site = c.dataset.s; render(); }
  else if (c.closest("#typeSeg")) { F.type = c.dataset.v; document.querySelectorAll("#typeSeg button").forEach(b => b.classList.toggle("on", b === c)); render(); }
  else if (c.classList.contains("t")) openView(c.dataset.id);
  else if (c.id === "newBtn") { $("#newForm").type.value = F.type; fillNewForm(); $("#newDlg").showModal(); }
  else if (c.id === "cancelNew") $("#newDlg").close();
  else if (c.id === "closeView") $("#viewDlg").close();
  else if (c.id === "saveView") saveView(c.dataset.id);
  else if (c.id === "out") db.auth.signOut().then(() => location.reload());
  else if (c.id === "signUp") authDo("signUp");
});
$("#newForm").addEventListener("change", e => { if (e.target.name === "type") fillNewForm(); });
$("#newForm").addEventListener("submit", createTicket);
$("#statusSel").onchange = e => { F.status = e.target.value; render(); };
$("#q").oninput = e => { F.q = e.target.value; render(); };
$("#exp").onchange = e => { if (e.target.value) exportData(e.target.value); e.target.value = ""; };
$("#authForm").addEventListener("submit", e => { e.preventDefault(); authDo("signInWithPassword"); });
async function authDo(fn) {
  const d = Object.fromEntries(new FormData($("#authForm")));
  const { error } = await db.auth[fn]({ email: d.email, password: d.password });
  if (error) { $("#authErr").textContent = error.message; return; }
  if (fn === "signUp") { $("#authErr").textContent = "Account created. Check your email to confirm it if required, then sign in."; return; }
  $("#authDlg").close(); boot();
}
setInterval(() => { if (T.length) render(); }, 60000);
boot();
</script>
</body>
</html>
